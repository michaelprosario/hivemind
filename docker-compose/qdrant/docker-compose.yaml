version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    ports:
      - "6333:6333" # REST API & Web UI
      - "6334:6334" # gRPC API

    volumes:
      - qdrant_storage:/qdrant/storage

    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?Set QDRANT_API_KEY}"

volumes:
  qdrant_storage:
    driver: local
